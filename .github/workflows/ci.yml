name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - build/phase-0-foundation

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/sparc
      - name: PR hygiene reminder
        if: github.event_name == 'pull_request'
        run: echo "Review the PR for credentials, .env files, archives, raw diagnostics, and generated build output."
