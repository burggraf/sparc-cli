[package]
name = "sparc"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
description = "Local encrypted artifact archive feasibility prototype for SPARC"

[dependencies]
age = { version = "0.12.1", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
